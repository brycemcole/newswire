name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - ios/**
      - .github/workflows/testflight.yml
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Check App Store Connect secrets
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY; do
            [ -n "${!name}" ] || { echo "::error::Missing secret for $name"; exit 1; }
          done
          printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "BUILD_NUMBER=$(( 100 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))" >> "$GITHUB_ENV"
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Archive
        run: |
          xcodebuild archive -project Newswire.xcodeproj -scheme Newswire -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Newswire.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM=A792L5W262 CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E "error:" "$RUNNER_TEMP/archive.log" | head -40; tail -30 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/archive.log"
      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Newswire.xcarchive" \
            -exportOptionsPlist ci/ExportOptions-AppStore.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log"
          echo "Uploaded Newswire build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ${{ runner.temp }}/*.log
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
